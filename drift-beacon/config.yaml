name: Drift Beacon
version: "0.2.47"
slug: drift-beacon
description: Activity tracking
url: https://github.com/drift-beacon/ha-app
webui: "[PROTO:ssl]://[HOST]:[PORT:9000]"
arch:
  - aarch64
ports:
  9000/tcp: 9000
  9001/tcp: 9001
ports_description:
  9000/tcp: Drift Beacon (HTTPS)
  9001/tcp: Drift Beacon (HTTP)
environment:
  NODE_ENV: production
  DEVICE_TYPE: home_assistant
  PUSH_WORKER_URL: https://push.driftbeacon.app
startup: application
boot: auto
# Seconds Home Assistant waits for the add-on to stop before killing it (10 when unset): the server's graceful
# shutdown, then s6-overlay's final sleep. The server's tests check it covers both with a margin.
timeout: 30
map:
  - type: ssl
schema:
  ssl: bool
  certfile: str?
  keyfile: str?
  # PLUGIN_UI_TRUSTED_ORIGINS: browser origins besides the add-on's own.
  trusted_origins: str?
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
init: false
